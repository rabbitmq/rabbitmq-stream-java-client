name: Test against RabbitMQ alphas

on:
  schedule:
    - cron:  '0 4 * * *'
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/docs/**'
      - '!src/test/java/com/rabbitmq/stream/docs/*'
      - pom.xml
      - ci/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - rabbitmq-image: pivotalrabbitmq/rabbitmq:v4.3.x-otp27
            erlang-version: 27
          - rabbitmq-image: pivotalrabbitmq/rabbitmq:v4.4.x-otp28
            erlang-version: 28
    name:  Test against ${{ matrix.rabbitmq-image }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout tls-gen
        uses: actions/checkout@v7
        with:
          repository: rabbitmq/tls-gen
          path: './tls-gen'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Start broker
        run: ci/start-broker.sh
        env:
          RABBITMQ_IMAGE: ${{ matrix.rabbitmq-image }}
          ERLANG_VERSION: ${{ matrix.erlang-version }}
      - name: Test
        run: |
          ./mvnw test -Drabbitmqctl.bin=DOCKER:rabbitmq
      - name: Stop broker
        run: docker stop rabbitmq && docker rm rabbitmq
      - name: Start cluster
        run: ci/start-cluster.sh
        env:
          RABBITMQ_IMAGE: ${{ matrix.rabbitmq-image }}
      - name: Test against cluster
        run: ./mvnw test -Dtest="*ClusterTest" -Drabbitmqctl.bin=DOCKER:rabbitmq0
      - name: Stop cluster
        run: docker compose --file ci/cluster/docker-compose.yml down
